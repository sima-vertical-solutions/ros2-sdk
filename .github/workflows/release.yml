name: Release

run-name: Release ${{ inputs.tag_name }} from main

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create from main, for example v2.1.3
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z]+)*$ ]]; then
            echo "Release tag must look like v2.1.3, got: ${tag}" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  verify-maintainer:
    name: Verify Maintainer Authorization
    needs: release-version
    uses: sima-neat/.github/.github/workflows/verify-maintainer.yml@main

  validate-release-readiness:
    name: Validate release readiness
    needs: [release-version, verify-maintainer]
    uses: sima-neat/.github/.github/workflows/release-engineering.yml@main
    with:
      release_version: ${{ needs.release-version.outputs.version }}
      project_owner: sima-vertical-solutions
      project_number: 2
    secrets:
      app_id: ${{ secrets.NEAT_RELEASES_APP_ID }}
      app_private_key: ${{ secrets.NEAT_RELEASES_APP_PRIVATE_KEY }}

  create-release:
    name: Create Draft Prerelease
    needs: validate-release-readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z]+)*$ ]]; then
            echo "Release tag must look like v2.1.3, got: ${tag}" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag already exists locally: ${tag}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists on origin: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes from main
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"

          {
            echo "## ROS 2 SDK ${tag}"
            echo
            echo "This tag is created from the current \`main\` branch."
            echo
            if [[ -n "${previous_tag}" ]]; then
              echo "Changes since ${previous_tag}:"
              range="${previous_tag}..HEAD"
            else
              echo "Changes in this release:"
              range="HEAD"
            fi
            echo

            if [[ -n "$(git log --first-parent --format=%H "${range}")" ]]; then
              git log --first-parent --reverse --pretty=format:'- %s (%h)' "${range}"
              echo
            else
              echo "- No commits found since ${previous_tag}."
            fi

            echo
            echo "Review and edit these notes before publishing the release."
          } > release-notes.md

          cat release-notes.md

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "${tag}" \
            --draft \
            --prerelease \
            --notes-file release-notes.md \
            --title "ROS 2 SDK ${tag}" \
            --verify-tag

      - name: Build trigger note
        run: |
          echo "Pushed ${{ steps.tag.outputs.tag }} from main."
          echo "The ARM64 ROS 2 SDK image build is triggered by the tag push."
