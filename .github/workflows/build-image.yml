name: Build ARM64 ROS 2 SDK image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Modalix image (ARM64)
    runs-on: ubuntu-24.04-arm
    outputs:
      install_image_resource: ${{ steps.image.outputs.install_image_resource }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve package and image tags
        id: image
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          canonical_package="ros2-sdk"
          package="${canonical_package}"
          source_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          release_tag=""
          build_time="$(date -u +%Y%m%dT%H%M%SZ)"
          extra_tags=()

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags=("latest" "main" "sha-${GITHUB_SHA}")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags=("${GITHUB_REF_NAME}" "sha-${GITHUB_SHA}")
            release_tag="${GITHUB_REF_NAME}"
          else
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            branch_slug="$(echo "${branch}" | tr '[:upper:]' '[:lower:]')"
            branch_slug="$(echo "${branch_slug}" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
            if [[ -z "${branch_slug}" ]]; then
              branch_slug="branch"
            fi
            package="${canonical_package}-${branch_slug}"
            tags=("latest" "sha-${GITHUB_SHA}")
          fi

          image="ghcr.io/${owner}/${package}"
          canonical_image="ghcr.io/${owner}/${canonical_package}"
          install_tag="sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            install_tag="${GITHUB_REF_NAME}"
          elif [[ "${package}" != "${canonical_package}" ]]; then
            # sima-cli 2.1.16 identifies the canonical ros2-sdk repository as
            # a ROS 2 SDK. Keep the isolated branch package for direct testing,
            # and publish an immutable canonical tag for Vulcan installation.
            extra_tags+=("${canonical_image}:${install_tag}")
          fi
          {
            echo "name=${image}"
            echo "install_image_resource=ghcr:${owner}/${canonical_package}:${install_tag}"
            echo "source_branch=${source_branch}"
            echo "release_tag=${release_tag}"
            echo "git_hash=${GITHUB_SHA:0:12}"
            echo "build_time=${build_time}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]/#/${image}:}"
            if (( ${#extra_tags[@]} > 0 )); then
              printf '%s\n' "${extra_tags[@]}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          cache_ref_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # Fork PRs consume only the trusted main cache. Same-repository PRs
            # may also consume the cache previously written by their source
            # branch, while remaining read-only during the build.
            cache_ref_name="main"
            if [[ "${PR_HEAD_REPOSITORY:-}" == "${GITHUB_REPOSITORY}" &&
                  -n "${GITHUB_HEAD_REF:-}" ]]; then
              cache_ref_name="${GITHUB_HEAD_REF}"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]] &&
               [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+)[.]([0-9]+)[.] ]]; then
            cache_ref_name="release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi

          cache_scope="$(echo "${cache_ref_name}" | tr '[:upper:]' '[:lower:]')"
          cache_scope="$(echo "${cache_scope}" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g')"
          if [[ -z "${cache_scope}" ]]; then
            cache_scope="branch"
          fi

          cache_ref="ghcr.io/${owner}/ros2-sdk-buildcache:${cache_scope}-aarch64"
          base_cache_ref="ghcr.io/${owner}/ros2-sdk-buildcache:main-aarch64"
          echo "cache_ref=${cache_ref}" >> "${GITHUB_OUTPUT}"
          if [[ "${cache_ref}" == "${base_cache_ref}" ]]; then
            echo "cache_from=${cache_ref}" >> "${GITHUB_OUTPUT}"
          else
            echo "cache_from=${cache_ref} ${base_cache_ref}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish ARM64 image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          CACHE_REF: ${{ steps.image.outputs.cache_ref }}
          CACHE_FROM: ${{ steps.image.outputs.cache_from }}
          SDK_GIT_BRANCH: ${{ steps.image.outputs.source_branch }}
          SDK_GIT_HASH: ${{ steps.image.outputs.git_hash }}
          SDK_BUILD_TIME: ${{ steps.image.outputs.build_time }}
          SDK_RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
        run: |
          set -euo pipefail

          build_args=(
            --file Dockerfile.modalix
            --platform linux/arm64
            --build-arg "SDK_GIT_BRANCH=${SDK_GIT_BRANCH}"
            --build-arg "SDK_GIT_HASH=${SDK_GIT_HASH}"
            --build-arg "SDK_BUILD_TIME=${SDK_BUILD_TIME}"
            --build-arg "SDK_RELEASE_TAG=${SDK_RELEASE_TAG}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --provenance=false
          )

          read -r -a cache_from_refs <<< "${CACHE_FROM}"
          for cache_from_ref in "${cache_from_refs[@]}"; do
            build_args+=(--cache-from "type=registry,ref=${cache_from_ref}")
          done

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && build_args+=(--tag "${tag}")
          done <<< "${IMAGE_TAGS}"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            build_args+=(--output type=cacheonly)
          else
            build_args+=(--push)
            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
              build_args+=(
                --cache-to
                "type=registry,ref=${CACHE_REF},mode=max,oci-mediatypes=true,image-manifest=true"
              )
            fi
          fi

          docker buildx build "${build_args[@]}" .

      - name: Publish image reference summary
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo "### ARM64 image"
            echo
            echo "Package: \`${IMAGE_NAME}\`"
            echo
            echo '```text'
            printf '%s\n' "${IMAGE_TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  prepare-vulcan-install-stub:
    name: Prepare ROS 2 SDK install stub
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test ROS 2 SDK package helpers
        run: |
          tests/test-install-ros2-sdk-stub.sh
          tests/test-sdk-release.sh

      - name: Install sima-cli
        run: |
          set -euo pipefail

          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install sima-cli
          SIMA_CLI_CHECK_FOR_UPDATE=0 sima-cli --version

      - name: Prepare ROS 2 SDK install-stub package
        env:
          IMAGE_RESOURCE: ${{ needs.build.outputs.install_image_resource }}
        run: |
          set -euo pipefail

          package_version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi

          source .venv/bin/activate
          tools/prepare_vulcan_package.sh \
            --output-dir dist \
            --image-resource "${IMAGE_RESOURCE}" \
            --version "${package_version}" \
            --release "${GITHUB_SHA}"

      - name: Upload ROS 2 SDK install-stub package
        uses: actions/upload-artifact@v7
        with:
          name: ros2-sdk-install-stub
          path: dist/
          if-no-files-found: error

  publish-vulcan-install-stub:
    name: Publish ROS 2 SDK install stub to Vulcan
    if: github.event_name != 'pull_request'
    needs: prepare-vulcan-install-stub
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@agent/vertical-solutions-staging
    with:
      aws_region: us-west-2
      environment_name: ${{ vars.VULCAN_ENV || 'production' }}
      artifact_pattern: ros2-sdk-install-stub
      artifact_glob: "**/*"
      min_artifact_count: 2

  mark-vulcan-install-stub-latest:
    name: Mark ROS 2 SDK install stub as latest
    if: github.event_name != 'pull_request'
    needs: publish-vulcan-install-stub
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@agent/vertical-solutions-staging
    with:
      aws_region: us-west-2
      environment_name: ${{ vars.VULCAN_ENV || 'production' }}
